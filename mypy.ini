[mypy]
python_version = 3.10
files = MODEL/cs2model/config.py, MODEL/cs2model/economic.py, MODEL/cs2model/drift.py, MODEL/cs2model/reproducibility.py, MODEL/monitor_drift.py, MODEL/smoke_pipeline.py
ignore_missing_imports = True
follow_imports = skip
check_untyped_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
