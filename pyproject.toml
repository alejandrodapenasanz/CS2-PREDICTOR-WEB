[tool.pytest.ini_options]
testpaths = ["CS2/TESTS"]
pythonpath = ["CS2"]
cache_dir = "CS2/TESTS/.cache/pytest"

[tool.ruff]
line-length = 120
target-version = "py313"
cache-dir = "CS2/TESTS/.cache/ruff"
exclude = ["CS2/SCRAPER/Scrapling", "**/.venv", "**/site-packages"]

[tool.ruff.lint]
select = ["F", "E9"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"CS2/TESTS/*" = ["F811", "E402"]

[tool.mypy]
python_version = "3.13"
files = [
    "CS2/MODEL/cs2model/config.py",
    "CS2/MODEL/cs2model/economic.py",
    "CS2/MODEL/cs2model/drift.py",
    "CS2/MODEL/cs2model/reproducibility.py",
    "CS2/MODEL/monitor_drift.py",
    "CS2/MODEL/smoke_pipeline.py",
]
cache_dir = "CS2/TESTS/.cache/mypy"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
