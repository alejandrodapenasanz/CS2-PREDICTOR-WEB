version: 6
random_seed: 42

training:
  warmup_weeks: 10
  min_train_rows: 800
  form_half_life_days: 120.0
  recency_half_life_days: 365.0
  walk_forward_gap_periods: 0
  feature_profile: core
  optuna_trials: 8
  optuna_retune_weeks: 26
  final_calibration_fraction: 0.18
  model_selection_min_history: 200

feature_selection:
  validation_periods: 8
  retune_periods: 13
  min_log_loss_gain: 0.0005
  min_validation_rows: 80
  min_validation_available_rows: 20

health_gates:
  max_completed_placeholders: 0
  max_foreign_key_errors: 0
  max_evaluation_metric_delta: 1.0e-8
  max_log_loss_vs_glicko: 0.0
  min_recent_coverage_ratio: 0.5
  min_coverage_sample: 20

# Un challenger solo puede sustituir al vivo sobre un holdout común que el
# incumbent no haya visto. La banda epsilon evita promociones por ruido.
promotion:
  min_common_holdout_rows: 100
  log_loss_epsilon: 0.001
  brier_epsilon: 0.0005
  auto_retrain_new_labeled: 100

# La poda productiva permanece bloqueada hasta confirmar una primera keep-list.
retention:
  # 0 conserva exclusivamente los punteros latest + last_good.
  registry_keep: 0
  # Los runs citados por la BBDD/master son evidencia y permanecen protegidos.
  # Entre los no referenciados solo se conservan el actual y el anterior.
  pipeline_runs_keep: 2

# Diagnostico descriptivo; nunca promueve ni activa features por si solo.
segment_calibration:
  min_backtest_segment_rows: 100
  min_live_segment_rows: 100
  min_live_total_rows_for_decisions: 1000
  reliability_bins: 10
  min_absolute_gap: 0.03
  min_ece: 0.04

# Challenger causal de rating sensible al roster. Ante >=2 sustituciones en el
# quinteto anunciado, conserva una fraccion del credito sobre 1500:
# f = floor + (1-floor) * jugadores_mantenidos/5. La nueva varianza de RD es
# f*RD^2 + (1-f)*RD_max^2. No se activa si falta un 5v5 point-in-time completo.
roster_rating:
  lineup_size: 5
  lookback_days: 90
  core_change_min_replacements: 2
  minimum_credit_fraction: 0.20
  neutral_rating: 1500.0
  maximum_rd: 350.0

# Harness de evaluacion honesto (MODEL/evaluate.py + cs2model/evaluation.py).
# El bucle externo estima rendimiento; el interno decide (hiperparam/familias/
# calibracion) solo con datos pasados. Gap = embargo temporal.
evaluation:
  warmup_periods: 10
  gap_periods: 1
  outer_step: 4            # ancho del bloque de test externo (semanas); 4 ~= mensual
  inner_step: 4
  inner_warmup: 8
  window: expanding        # expanding | sliding (el CLI puede correr ambos con --window both)
  train_width: 52          # ancho de la ventana deslizante (periodos)
  l2_grid: [0.25, 1.0, 4.0]
  calibration_methods: [identity, platt, isotonic]
  recency_half_life: 0.0   # 0 = sin ponderado por recencia

feature_thresholds:
  opening_odds: 120
  map_box_scores: 200
  event_history: 200
  analytics: 120
  analytics_extended: 200
  announced_lineups: 200
  event_metadata: 300
  player_snapshots: 200
  rankings: 200
  roster: 200
  mov_rating: 800
  team_trueskill: 800
  player_rating: 200
  strength_of_schedule: 800
  bayesian_bradley_terry: 800
  kalman_state_space: 800
  bo3_map_compositional: 500
  regime: 200
  context_total: 200
  context_per_environment: 50
  segment_interactions: 800
  rich_target_total: 2000
  rich_target_per_class: 300

estimators:
  logistic:
    max_iter: 2000
    c_default: 0.5
  lightgbm:
    n_estimators: 2000
    learning_rate: 0.02
    num_leaves: 31
    min_child_samples: 80
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 5.0
  catboost:
    iterations: 2000
    learning_rate: 0.02
    depth: 5
    l2_leaf_reg: 6.0
  xgboost:
    n_estimators: 700
    learning_rate: 0.02
    max_depth: 4
    min_child_weight: 20.0
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 5.0
  random_forest:
    n_estimators: 600
    min_samples_leaf: 12

drift:
  rolling_window: 200
  reference_window: 500
  min_samples: 50
  page_hinkley_delta: 0.005
  page_hinkley_threshold: 5.0
  warning_log_loss_ratio: 1.10
  warning_mean_clv: -0.02
  regime_map_window_days: 120
  regime_previous_window_days: 120
  regime_min_observed_maps: 20

economic_backtest:
  initial_bankroll: 1000.0
  kelly_multiplier: 0.25
  max_stake_fraction: 0.025
  min_stake_amount: 1.0
  max_stake_amount: 100.0
  max_profit_amount: 5000.0
  min_expected_roi: 0.0
  execution_odds_haircut: 0.0
  require_closing_odds: false

