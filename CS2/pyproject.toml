[tool.pytest.ini_options]
testpaths = ["TESTS"]
pythonpath = ["."]
cache_dir = "TESTS/.cache/pytest"

[tool.ruff]
line-length = 120
target-version = "py310"
cache-dir = "TESTS/.cache/ruff"
exclude = ["SCRAPER/Scrapling", "**/.venv", "**/site-packages"]

[tool.ruff.lint]
select = ["F", "E9"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"TESTS/*" = ["F811", "E402"]

[tool.mypy]
python_version = "3.10"
files = [
    "MODEL/cs2model/config.py",
    "MODEL/cs2model/economic.py",
    "MODEL/cs2model/drift.py",
    "MODEL/cs2model/reproducibility.py",
    "MODEL/monitor_drift.py",
    "MODEL/smoke_pipeline.py",
]
cache_dir = "TESTS/.cache/mypy"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
