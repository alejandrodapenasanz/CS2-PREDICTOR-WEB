name: CI

on:
  push:
    branches: [main, dev, pre-dev, TENNIS]
  pull_request:
    branches: [main, dev, pre-dev, TENNIS]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CS2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CS2/requirements.txt
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          # Stack ML del lado modelo (el scraper tiene su propio venv aparte).
          python -m pip install numpy pandas scikit-learn scipy matplotlib lightgbm shap optuna pyyaml parsel pytest ruff mypy
      - name: Ruff
        run: |
          ruff check MODEL BBDD PIPELINE TESTS
      - name: Mypy infrastructure
        run: python -m mypy
      - name: Run test suite
        run: python -m pytest TESTS/ -q
      - name: Deterministic pipeline smoke
        run: python MODEL/smoke_pipeline.py
