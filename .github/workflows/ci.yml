name: CI

on:
  push:
    branches: [main, dev, pre-dev]
  pull_request:
    branches: [main, dev, pre-dev]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CS2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CS2/requirements.lock.txt
      - name: Install locked project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip check
      - name: Ruff
        run: |
          ruff check MODEL BBDD PIPELINE TESTS
      - name: Mypy infrastructure
        run: python -m mypy
      - name: Run test suite
        run: python -m pytest TESTS/ -q
      - name: Deterministic pipeline smoke
        run: python MODEL/smoke_pipeline.py
