name: CI

on:
  push:
    branches: [main, dev, pre-dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          # Stack ML del lado modelo (el scraper tiene su propio venv aparte).
          python -m pip install numpy pandas scikit-learn scipy matplotlib lightgbm shap parsel pytest
      - name: Ruff (lint, no bloqueante)
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check MODEL BBDD DAILY_SNAPSHOTS || true
      - name: Run test suite
        run: python -m pytest tests/ -q
